name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci_only_jwt_secret_not_for_production_use_000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@10.8.3
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
